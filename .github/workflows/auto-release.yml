name: Auto Release on Main

# main 에 push (PR 머지 포함) 될 때마다 자동으로 patch 버전을 올려서
# Release 를 publish 한다. 이 Release publish 가 deploy.yml 의 트리거가 되어
# Actions 빌드 + 자산 업로드 + 운영 배포까지 모두 자동 진행된다.
#
# 스킵 조건 (커밋 메시지 기준):
#   - "[no-release]" 가 들어있으면 release 안 만듦 (문서/설정 변경 등)
#   - "[skip ci]" / "[ci skip]" 가 들어있으면 안 만듦 (관례)
#   - 머지 커밋에 위 마커가 들어있으면 함께 적용됨
#
# 안전장치:
#   - permissions: contents:write (빌트인 토큰은 release 생성에만 사용)
#   - 실제 release publish 는 PAT_TOKEN 으로 → release.published 이벤트가
#     deploy.yml 트리거 가능 (GitHub 의 token-scoped event 정책 우회).
#     ※ 이 정책 때문에 PR-D2 (2026-04-27) 이전에는 v0.8.4~v0.8.6 이 published
#       됐어도 deploy.yml 이 안 돌았음. 반드시 PAT_TOKEN 사용 유지.
#   - tag 충돌 시 release 생성 실패 → 워크플로 fail (수동 개입 필요)
#   - timeout 5분 (충분히 짧음, 무한 대기 방어)

on:
  push:
    branches: [main]

permissions:
  contents: write   # gh release create 가 tag + release 생성
  actions: write    # PAT 실패 시 deploy.yml 을 workflow_dispatch 로 직접 트리거

jobs:
  release:
    name: Patch 버전 자동 release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      !contains(github.event.head_commit.message, '[no-release]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tag 조회 위해 전체 히스토리 필요

      - name: 다음 버전 계산
        id: ver
        run: |
          set -eu

          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)

          if [ -z "$LATEST" ]; then
            NEXT="v0.1.0"
            REASON="첫 release (기존 태그 없음)"
          else
            VER="${LATEST#v}"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)

            # 비표준 형식 방어 — patch 가 숫자가 아니면 fail
            if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "::error::최신 태그 '$LATEST' 의 patch 부분이 숫자가 아닙니다 (수동 개입 필요)"
              exit 1
            fi

            NEXT="v${MAJOR}.${MINOR}.$((PATCH+1))"
            REASON="$LATEST → $NEXT (patch +1)"
          fi

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          {
            echo "## 🏷️ 다음 버전"
            echo ""
            echo "- **이전**: \`${LATEST:-(없음)}\`"
            echo "- **신규**: \`$NEXT\`"
            echo "- **사유**: $REASON"
            echo "- **커밋**: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release 생성 + 배포 트리거
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          NEXT="${{ steps.ver.outputs.next }}"

          # ═══════════════════════════════════════════════════════════
          # 토큰 선택
          #
          # ★ 2026-08-19 수정 — 8/12 배포 실패 원인:
          #   기존 코드는  GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          #   `||` 는 secret 이 "비어있을 때"만 폴백한다. PAT 이 존재하지만
          #   만료/무효면 그대로 사용되어 `gh release create` 가 401 로 죽고,
          #   release 자체가 안 만들어져 deploy.yml 도 안 돈다.
          #   실제로 8/12 #418 머지가 이 경로로 실패했고, 이후 7주간 배포가
          #   수동 cherry-pick + 서버 빌드로 우회되며 서버 divergence 가 쌓였다.
          #
          #   → PAT 을 "실제로 호출해" 유효성을 확인하고, 무효면 GITHUB_TOKEN 으로
          #     폴백한다. 폴백 시엔 release.published 가 다른 워크플로를 트리거하지
          #     못하므로 deploy.yml 을 workflow_dispatch 로 직접 호출한다.
          # ═══════════════════════════════════════════════════════════
          USE_PAT=0
          if [ -n "${PAT_TOKEN:-}" ]; then
            if GH_TOKEN="$PAT_TOKEN" gh api "repos/$REPO" --silent 2>/dev/null; then
              USE_PAT=1
              echo "::notice::PAT_TOKEN 유효 — release.published 로 deploy.yml 자동 트리거"
            else
              echo "::warning::PAT_TOKEN 이 설정돼 있으나 인증 실패(만료/권한부족). GITHUB_TOKEN 으로 폴백합니다. PAT 재발급을 권장합니다."
            fi
          else
            echo "::warning::PAT_TOKEN 미설정 — GITHUB_TOKEN 으로 진행합니다."
          fi

          if [ "$USE_PAT" = "1" ]; then
            export GH_TOKEN="$PAT_TOKEN"
          else
            export GH_TOKEN="$FALLBACK_TOKEN"
          fi

          # 동일 태그가 이미 있으면 (수동 생성됐던 경우) 그냥 종료
          if gh release view "$NEXT" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Release $NEXT 가 이미 존재. 스킵."
            exit 0
          fi

          gh release create "$NEXT" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$NEXT" \
            --generate-notes \
            --notes "_자동 생성됨 — \`auto-release.yml\` (커밋 \`$SHA\`)_"

          echo "✅ Release $NEXT 생성"

          # ── 배포 트리거 ──
          if [ "$USE_PAT" = "1" ]; then
            echo "→ release.published 이벤트로 deploy.yml 자동 실행됩니다."
          else
            echo "→ GITHUB_TOKEN 으로 만든 release 는 다른 워크플로를 트리거하지 못합니다."
            echo "→ deploy.yml 을 workflow_dispatch 로 직접 호출합니다."
            if gh workflow run deploy.yml \
                 --repo "$REPO" \
                 -f confirm=DEPLOY \
                 -f target_tag="$NEXT"; then
              echo "✅ deploy.yml 트리거 완료 (tag=$NEXT)"
            else
              echo "::error::deploy.yml 자동 트리거 실패. Actions 탭에서 'Deploy to Production' 을 수동 실행하세요 (confirm=DEPLOY, target_tag=$NEXT)."
              exit 1
            fi
          fi

          {
            echo ""
            echo "## 🚀 배포"
            echo ""
            echo "- **tag**: \`$NEXT\`"
            echo "- **토큰**: $([ "$USE_PAT" = "1" ] && echo 'PAT_TOKEN' || echo 'GITHUB_TOKEN (폴백)')"
            echo "- **트리거**: $([ "$USE_PAT" = "1" ] && echo 'release.published (자동)' || echo 'workflow_dispatch (명시적 호출)')"
          } >> "$GITHUB_STEP_SUMMARY"
